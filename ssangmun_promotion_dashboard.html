<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>쌍문역지점 프로모션 대시보드</title>
  <style>
    :root {
      --bg-0: #0b1120;
      --bg-1: #111a2f;
      --card: #17213c;
      --line: #2a3b66;
      --text: #e9f2ff;
      --muted: #9cb0d9;
      --accent: #67e8f9;
      --accent-2: #a78bfa;
      --champion: #ffd166;
      --good: #22c55e;
      --danger: #ef4444;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -20%, rgba(103, 232, 249, 0.18), transparent),
        radial-gradient(900px 400px at 100% 0%, rgba(167, 139, 250, 0.2), transparent),
        linear-gradient(160deg, var(--bg-0), var(--bg-1));
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 16px;
    }

    .panel {
      background: linear-gradient(180deg, rgba(23, 33, 60, 0.96), rgba(15, 23, 42, 0.96));
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .left-panel {
      position: sticky;
      top: 20px;
      max-height: calc(100vh - 40px);
      overflow: auto;
    }

    .section {
      padding: 18px 18px 12px;
      border-bottom: 1px solid rgba(156, 176, 217, 0.15);
    }

    .section:last-child {
      border-bottom: 0;
    }

    .title-wrap {
      padding: 20px 22px;
      border-bottom: 1px solid rgba(156, 176, 217, 0.2);
    }

    .title {
      margin: 0;
      font-size: clamp(1.6rem, 2.8vw, 2.7rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      text-shadow: 0 0 16px rgba(103, 232, 249, 0.35);
      background: linear-gradient(90deg, #67e8f9 0%, #a78bfa 45%, #f472b6 85%, #67e8f9 100%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: titleFlow 4s linear infinite;
      position: relative;
      display: inline-block;
      white-space: nowrap;
    }

    .title::after {
      content: "";
      position: absolute;
      top: -6px;
      left: -30%;
      width: 30%;
      height: calc(100% + 12px);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      transform: skewX(-20deg);
      animation: shineSweep 3.5s ease-in-out infinite;
      pointer-events: none;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    @keyframes titleFlow {
      to {
        background-position: 220% center;
      }
    }

    @keyframes shineSweep {
      0% {
        left: -35%;
      }
      35% {
        left: 110%;
      }
      100% {
        left: 110%;
      }
    }

    h3 {
      margin: 0 0 10px;
      font-size: 1.02rem;
      letter-spacing: 0.02em;
    }

    .caption {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.45;
      margin-bottom: 10px;
    }

    .file-input {
      width: 100%;
      border: 1px dashed rgba(103, 232, 249, 0.6);
      background: rgba(15, 23, 42, 0.5);
      border-radius: 14px;
      padding: 10px;
      color: var(--muted);
    }

    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      border: 1px solid rgba(103, 232, 249, 0.4);
      border-radius: 12px;
      padding: 9px 10px;
      color: var(--text);
      background: linear-gradient(180deg, rgba(103, 232, 249, 0.2), rgba(103, 232, 249, 0.06));
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-weight: 600;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(103, 232, 249, 0.2);
    }

    button.secondary {
      border-color: rgba(167, 139, 250, 0.55);
      background: linear-gradient(180deg, rgba(167, 139, 250, 0.25), rgba(167, 139, 250, 0.07));
    }

    .status {
      margin-top: 10px;
      font-size: 0.84rem;
      color: var(--muted);
      min-height: 20px;
    }

    .status.error {
      color: #ff9a9a;
    }

    .rates-list {
      display: grid;
      gap: 8px;
    }

    .rate-item {
      display: grid;
      grid-template-columns: 1fr 110px;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid rgba(156, 176, 217, 0.15);
      background: rgba(17, 26, 47, 0.55);
    }

    .rate-item span {
      font-size: 0.88rem;
      color: #dbeafe;
      line-height: 1.25;
    }

    .rate-item input {
      width: 100%;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(156, 176, 217, 0.3);
      border-radius: 8px;
      color: var(--text);
      padding: 7px 8px;
      text-align: right;
      font-weight: 600;
      font-size: 0.85rem;
    }

    .employee-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .employee-tags span {
      border: 1px solid rgba(103, 232, 249, 0.3);
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 0.8rem;
      color: #d9edff;
      background: rgba(103, 232, 249, 0.12);
    }

    .main-panel {
      display: grid;
      grid-template-rows: auto auto auto 1fr;
      gap: 14px;
      padding: 16px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(160px, 1fr));
      gap: 12px;
    }

    .summary-card {
      border: 1px solid rgba(156, 176, 217, 0.25);
      border-radius: 14px;
      padding: 14px;
      background: rgba(17, 26, 47, 0.6);
    }

    .summary-card h4 {
      margin: 0;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 600;
    }

    .summary-card .value {
      margin-top: 8px;
      font-size: 1.45rem;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .running-total {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(103, 232, 249, 0.28);
      border-radius: 14px;
      padding: 14px 14px 18px;
      background: linear-gradient(180deg, rgba(103, 232, 249, 0.16), rgba(103, 232, 249, 0.03));
    }

    .running-total h4 {
      margin: 0;
      color: #d9f6ff;
      font-size: 0.9rem;
    }

    .running-total .big {
      margin-top: 10px;
      font-size: clamp(1.2rem, 2.8vw, 2rem);
      font-weight: 900;
      text-shadow: 0 0 18px rgba(103, 232, 249, 0.4);
    }

    .progress-track {
      margin-top: 10px;
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: rgba(17, 26, 47, 0.9);
      border: 1px solid rgba(103, 232, 249, 0.22);
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, #67e8f9, #a78bfa, #f472b6);
      box-shadow: 0 0 16px rgba(103, 232, 249, 0.55);
      transition: width 0.2s linear;
    }

    .spark {
      position: absolute;
      right: 8px;
      top: 5px;
      font-size: 1.1rem;
      opacity: 0.75;
      animation: sparkFloat 2.3s ease-in-out infinite;
    }

    @keyframes sparkFloat {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-5px) rotate(10deg);
      }
    }

    .employee-cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(200px, 1fr));
      gap: 10px;
    }

    .employee-card {
      border: 1px solid rgba(156, 176, 217, 0.22);
      border-radius: 14px;
      background: rgba(17, 26, 47, 0.58);
      padding: 12px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .employee-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 26px rgba(0, 0, 0, 0.3);
    }

    .employee-card .name {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
    }

    .employee-card .amount {
      margin-top: 8px;
      font-size: 1.2rem;
      font-weight: 800;
    }

    .employee-card .sub {
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .employee-card.champion {
      border-color: rgba(255, 209, 102, 0.9);
      background:
        radial-gradient(circle at 10% 20%, rgba(255, 209, 102, 0.28), transparent 36%),
        linear-gradient(180deg, rgba(255, 209, 102, 0.2), rgba(255, 209, 102, 0.06));
      box-shadow: 0 0 0 1px rgba(255, 209, 102, 0.45), 0 0 28px rgba(255, 209, 102, 0.32);
      animation: championPulse 2.2s ease-in-out infinite;
    }

    .champion-badge {
      position: absolute;
      right: 10px;
      top: 8px;
      color: #3f2a00;
      background: linear-gradient(180deg, #ffe7a3, #ffd166);
      border: 1px solid rgba(63, 42, 0, 0.25);
      border-radius: 999px;
      font-size: 0.74rem;
      padding: 4px 8px;
      font-weight: 800;
      box-shadow: 0 4px 12px rgba(255, 209, 102, 0.38);
    }

    @keyframes championPulse {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-1px);
      }
    }

    .table-wrap {
      border: 1px solid rgba(156, 176, 217, 0.2);
      border-radius: 14px;
      overflow: auto;
      background: rgba(17, 26, 47, 0.48);
    }

    table {
      border-collapse: collapse;
      width: 100%;
      min-width: 980px;
      font-size: 0.9rem;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(11, 17, 32, 0.95);
      border-bottom: 1px solid rgba(156, 176, 217, 0.3);
    }

    th,
    td {
      border-right: 1px solid rgba(156, 176, 217, 0.15);
      padding: 10px 8px;
      text-align: right;
      white-space: nowrap;
    }

    th:first-child,
    td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      z-index: 1;
      background: rgba(11, 17, 32, 0.97);
      font-weight: 700;
    }

    tbody tr:nth-child(even) td {
      background: rgba(156, 176, 217, 0.04);
    }

    tbody tr.total-row td {
      font-weight: 800;
      color: #fdf3c2;
      background: rgba(255, 209, 102, 0.08);
    }

    .footer-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 0.8rem;
      line-height: 1.45;
    }

    @media (max-width: 1100px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .left-panel {
        position: static;
        max-height: none;
      }

      .summary-grid {
        grid-template-columns: 1fr;
      }

      .employee-cards {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 12px;
      }

      .employee-cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <aside class="panel left-panel">
      <section class="section">
        <h3>엑셀 업로드</h3>
        <p class="caption">.xlsx / .xls / .csv 파일을 올리면 직원별 실적과 포상금이 자동 집계됩니다.</p>
        <input id="excelInput" class="file-input" type="file" accept=".xlsx,.xls,.csv">
        <div class="btn-row">
          <button id="sampleBtn" type="button">샘플 데이터</button>
          <button id="downloadTemplateBtn" class="secondary" type="button">양식 다운로드</button>
        </div>
        <div id="statusText" class="status">대기 중...</div>
      </section>

      <section class="section">
        <h3>프로모션 항목(왼쪽)</h3>
        <p class="caption">아래 단가(원)를 수정하면 포상금 합계가 즉시 다시 계산됩니다.</p>
        <div id="ratesList" class="rates-list"></div>
      </section>

      <section class="section">
        <h3>대상 직원</h3>
        <div id="employeeTags" class="employee-tags"></div>
      </section>
    </aside>

    <main class="panel main-panel">
      <div class="title-wrap">
        <h1 class="title">쌍문역지점 프로모션</h1>
        <p class="subtitle">직원별 실적 집계 / 포상금 합계 / MVP 하이라이트</p>
      </div>

      <section class="summary-grid">
        <div class="summary-card">
          <h4>전체 직원 수</h4>
          <div id="employeeCount" class="value">0명</div>
        </div>
        <div class="summary-card">
          <h4>최고 포상금 직원</h4>
          <div id="topEmployee" class="value">-</div>
        </div>
        <div class="running-total">
          <span class="spark">✨</span>
          <h4>전체 누적 포상금 (시간 경과 애니메이션)</h4>
          <div id="animatedTotal" class="big">₩0</div>
          <div class="progress-track">
            <div id="animatedBar" class="progress-bar"></div>
          </div>
        </div>
      </section>

      <section id="employeeCards" class="employee-cards"></section>

      <section class="table-wrap">
        <table id="matrixTable"></table>
      </section>

      <p class="footer-note">
        엑셀 인식 형식: (1) <b>직원행-항목열</b> 또는 (2) <b>항목행-직원열</b>.
        누락된 셀은 0으로 계산됩니다.
      </p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
  <script>
    const CATEGORIES = [
      "방카",
      "투자상품 거치식",
      "투자상품 적립식",
      "신용카드",
      "청약",
      "개인형 IRP 신규",
      "개인형 IRP 계약이전",
      "연금변경",
      "나라사랑카드"
    ];

    const EMPLOYEES = [
      "신기애",
      "양명민",
      "문햬경",
      "이정임",
      "양준영",
      "김은정",
      "김혜원",
      "김문희",
      "이경은"
    ];

    const DEFAULT_RATES = {
      "방카": 50000,
      "투자상품 거치식": 40000,
      "투자상품 적립식": 30000,
      "신용카드": 20000,
      "청약": 25000,
      "개인형 IRP 신규": 60000,
      "개인형 IRP 계약이전": 80000,
      "연금변경": 45000,
      "나라사랑카드": 15000
    };

    const CATEGORY_ALIASES = {
      "방카": ["방카", "방카슈랑스"],
      "투자상품 거치식": ["투자상품거치식", "거치식", "투자거치식"],
      "투자상품 적립식": ["투자상품적립식", "적립식", "투자적립식"],
      "신용카드": ["신용카드", "카드"],
      "청약": ["청약", "주택청약"],
      "개인형 IRP 신규": ["개인형irp신규", "irp신규", "개인형퇴직연금신규"],
      "개인형 IRP 계약이전": ["개인형irp계약이전", "irp계약이전", "irp이전", "계약이전"],
      "연금변경": ["연금변경", "연금상품변경"],
      "나라사랑카드": ["나라사랑카드", "나라사랑"]
    };

    let rewardRates = { ...DEFAULT_RATES };
    let performanceData = createEmptyPerformance();
    let previousTotal = 0;
    let animationId = null;

    const excelInput = document.getElementById("excelInput");
    const ratesList = document.getElementById("ratesList");
    const employeeTags = document.getElementById("employeeTags");
    const employeeCards = document.getElementById("employeeCards");
    const matrixTable = document.getElementById("matrixTable");
    const topEmployee = document.getElementById("topEmployee");
    const employeeCount = document.getElementById("employeeCount");
    const animatedTotal = document.getElementById("animatedTotal");
    const animatedBar = document.getElementById("animatedBar");
    const statusText = document.getElementById("statusText");
    const sampleBtn = document.getElementById("sampleBtn");
    const downloadTemplateBtn = document.getElementById("downloadTemplateBtn");

    function createEmptyPerformance() {
      const data = {};
      for (const employee of EMPLOYEES) {
        data[employee] = {};
        for (const category of CATEGORIES) {
          data[employee][category] = 0;
        }
      }
      return data;
    }

    function normalizeText(value) {
      return String(value ?? "")
        .trim()
        .replace(/\s+/g, "")
        .replace(/[^\w가-힣]/g, "")
        .toLowerCase();
    }

    function parseNumber(value) {
      if (typeof value === "number" && Number.isFinite(value)) {
        return value;
      }
      const cleaned = String(value ?? "")
        .replace(/,/g, "")
        .replace(/원/g, "")
        .replace(/\s/g, "")
        .replace(/[^0-9.-]/g, "");
      const parsed = Number(cleaned);
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formatCurrency(value) {
      return `₩${Math.round(value).toLocaleString("ko-KR")}`;
    }

    function formatNumber(value) {
      return Math.round(value).toLocaleString("ko-KR");
    }

    function resolveEmployee(cell) {
      const normalized = normalizeText(cell);
      if (!normalized) return null;
      return EMPLOYEES.find((name) => normalizeText(name) === normalized) || null;
    }

    function resolveCategory(cell) {
      const normalized = normalizeText(cell);
      if (!normalized) return null;

      for (const category of CATEGORIES) {
        if (normalizeText(category) === normalized) return category;
      }

      for (const category of CATEGORIES) {
        const aliases = CATEGORY_ALIASES[category] || [];
        if (aliases.some((alias) => normalized.includes(normalizeText(alias)))) {
          return category;
        }
      }
      return null;
    }

    function buildRatesUI() {
      ratesList.innerHTML = "";
      for (const category of CATEGORIES) {
        const row = document.createElement("label");
        row.className = "rate-item";

        const title = document.createElement("span");
        title.textContent = category;

        const input = document.createElement("input");
        input.type = "number";
        input.min = "0";
        input.step = "1000";
        input.value = rewardRates[category];
        input.dataset.category = category;
        input.addEventListener("input", () => {
          rewardRates[category] = Math.max(0, parseNumber(input.value));
          renderAll();
        });

        row.appendChild(title);
        row.appendChild(input);
        ratesList.appendChild(row);
      }
    }

    function buildEmployeeTags() {
      employeeTags.innerHTML = "";
      for (const name of EMPLOYEES) {
        const chip = document.createElement("span");
        chip.textContent = name;
        employeeTags.appendChild(chip);
      }
    }

    function calculateSummaries() {
      const employeeSummary = EMPLOYEES.map((employee) => {
        let performanceTotal = 0;
        let rewardTotal = 0;
        for (const category of CATEGORIES) {
          const value = parseNumber(performanceData[employee][category]);
          performanceTotal += value;
          rewardTotal += value * rewardRates[category];
        }
        return { employee, performanceTotal, rewardTotal };
      });

      employeeSummary.sort((a, b) => b.rewardTotal - a.rewardTotal);
      const allReward = employeeSummary.reduce((sum, item) => sum + item.rewardTotal, 0);
      return { employeeSummary, allReward };
    }

    function renderEmployeeCards(summary) {
      employeeCards.innerHTML = "";
      const leaderName = summary[0]?.employee;
      for (const row of summary) {
        const card = document.createElement("article");
        card.className = "employee-card";
        if (row.employee === leaderName && row.rewardTotal > 0) {
          card.classList.add("champion");
        }

        const name = document.createElement("p");
        name.className = "name";
        name.textContent = row.employee;

        const amount = document.createElement("div");
        amount.className = "amount";
        amount.textContent = formatCurrency(row.rewardTotal);

        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = `실적 합계: ${formatNumber(row.performanceTotal)}`;

        card.appendChild(name);
        card.appendChild(amount);
        card.appendChild(sub);

        if (row.employee === leaderName && row.rewardTotal > 0) {
          const badge = document.createElement("span");
          badge.className = "champion-badge";
          badge.textContent = "🏆 MVP";
          card.appendChild(badge);
        }

        employeeCards.appendChild(card);
      }
    }

    function renderMatrixTable(summary) {
      const byEmployee = Object.fromEntries(summary.map((x) => [x.employee, x]));
      const orderedEmployees = EMPLOYEES.slice().sort((a, b) => {
        return (byEmployee[b]?.rewardTotal || 0) - (byEmployee[a]?.rewardTotal || 0);
      });

      const thead = `
        <thead>
          <tr>
            <th>항목 \\ 직원</th>
            ${orderedEmployees.map((name) => `<th>${name}</th>`).join("")}
            <th>항목 합계</th>
          </tr>
        </thead>
      `;

      const bodyRows = CATEGORIES.map((category) => {
        let rowTotal = 0;
        const cols = orderedEmployees.map((employee) => {
          const val = parseNumber(performanceData[employee][category]);
          rowTotal += val;
          return `<td>${formatNumber(val)}</td>`;
        }).join("");
        return `
          <tr>
            <td>${category}</td>
            ${cols}
            <td>${formatNumber(rowTotal)}</td>
          </tr>
        `;
      });

      let grandPerformanceTotal = 0;
      const totalCols = orderedEmployees.map((employee) => {
        const employeeTotal = CATEGORIES.reduce((sum, c) => sum + parseNumber(performanceData[employee][c]), 0);
        grandPerformanceTotal += employeeTotal;
        return `<td>${formatNumber(employeeTotal)}</td>`;
      }).join("");

      bodyRows.push(`
        <tr class="total-row">
          <td>직원별 실적 합계</td>
          ${totalCols}
          <td>${formatNumber(grandPerformanceTotal)}</td>
        </tr>
      `);

      const rewardCols = orderedEmployees.map((employee) => {
        const rewardTotal = byEmployee[employee]?.rewardTotal || 0;
        return `<td>${formatCurrency(rewardTotal)}</td>`;
      }).join("");
      const allReward = summary.reduce((sum, item) => sum + item.rewardTotal, 0);
      bodyRows.push(`
        <tr class="total-row">
          <td>직원별 포상금 합계</td>
          ${rewardCols}
          <td>${formatCurrency(allReward)}</td>
        </tr>
      `);

      matrixTable.innerHTML = `${thead}<tbody>${bodyRows.join("")}</tbody>`;
    }

    function animateTotal(target) {
      if (animationId) {
        cancelAnimationFrame(animationId);
      }

      const from = previousTotal;
      const to = target;
      const duration = 2200;
      const startedAt = performance.now();

      function frame(now) {
        const t = Math.min(1, (now - startedAt) / duration);
        const eased = 1 - Math.pow(1 - t, 3);
        const current = from + (to - from) * eased;
        animatedTotal.textContent = formatCurrency(current);
        previousTotal = current;
        const ratio = to > 0 ? Math.max(0, Math.min(1, current / to)) : 0;
        animatedBar.style.width = `${ratio * 100}%`;
        if (t < 1) {
          animationId = requestAnimationFrame(frame);
        } else {
          previousTotal = to;
        }
      }

      animationId = requestAnimationFrame(frame);
    }

    function renderAll() {
      const { employeeSummary, allReward } = calculateSummaries();
      employeeCount.textContent = `${EMPLOYEES.length}명`;
      topEmployee.textContent = employeeSummary[0] && employeeSummary[0].rewardTotal > 0
        ? `${employeeSummary[0].employee} (${formatCurrency(employeeSummary[0].rewardTotal)})`
        : "-";
      renderEmployeeCards(employeeSummary);
      renderMatrixTable(employeeSummary);
      animateTotal(allReward);
    }

    function parseEmployeeRowFormat(rows) {
      if (!rows.length) return null;
      let headerRowIndex = -1;
      let employeeColIndex = -1;
      let categoryColMap = null;

      for (let r = 0; r < Math.min(rows.length, 12); r += 1) {
        const candidateHeader = rows[r] || [];
        const candidateEmployeeIdx = candidateHeader.findIndex((cell) => {
          const text = normalizeText(cell);
          return ["직원", "직원명", "성명", "이름", "담당자"].includes(text);
        });
        if (candidateEmployeeIdx < 0) continue;

        const candidateMap = {};
        for (let i = 0; i < candidateHeader.length; i += 1) {
          const category = resolveCategory(candidateHeader[i]);
          if (category) {
            candidateMap[category] = i;
          }
        }

        if (Object.keys(candidateMap).length >= 3) {
          headerRowIndex = r;
          employeeColIndex = candidateEmployeeIdx;
          categoryColMap = candidateMap;
          break;
        }
      }

      if (headerRowIndex < 0 || employeeColIndex < 0 || !categoryColMap) {
        return null;
      }

      const parsed = createEmptyPerformance();
      for (let r = headerRowIndex + 1; r < rows.length; r += 1) {
        const row = rows[r] || [];
        if (!row.some((cell) => String(cell).trim() !== "")) continue;
        const employee = resolveEmployee(row[employeeColIndex]);
        if (!employee) continue;
        for (const category of CATEGORIES) {
          const idx = categoryColMap[category];
          if (idx == null) continue;
          parsed[employee][category] += parseNumber(row[idx]);
        }
      }
      return parsed;
    }

    function parseCategoryRowFormat(rows) {
      if (rows.length < 2) return null;
      let headerRowIndex = -1;
      let employeeColMap = null;

      for (let r = 0; r < Math.min(rows.length, 12); r += 1) {
        const candidateHeader = rows[r] || [];
        const candidateEmployeeMap = {};
        for (let c = 0; c < candidateHeader.length; c += 1) {
          const employee = resolveEmployee(candidateHeader[c]);
          if (employee) {
            candidateEmployeeMap[employee] = c;
          }
        }
        if (Object.keys(candidateEmployeeMap).length >= 3) {
          headerRowIndex = r;
          employeeColMap = candidateEmployeeMap;
          break;
        }
      }

      if (headerRowIndex < 0 || !employeeColMap) {
        return null;
      }

      const parsed = createEmptyPerformance();
      for (let r = headerRowIndex + 1; r < rows.length; r += 1) {
        const row = rows[r];
        if (!row || row.length === 0) continue;
        const category = resolveCategory(row[0]);
        if (!category) continue;
        for (const employee of EMPLOYEES) {
          const col = employeeColMap[employee];
          if (col == null) continue;
          parsed[employee][category] += parseNumber(row[col]);
        }
      }

      return parsed;
    }

    function parseExcelRows(rows) {
      const byEmployeeRows = parseEmployeeRowFormat(rows);
      if (byEmployeeRows) return byEmployeeRows;

      const byCategoryRows = parseCategoryRowFormat(rows);
      if (byCategoryRows) return byCategoryRows;

      throw new Error("엑셀 형식을 인식하지 못했습니다. 헤더를 확인해 주세요.");
    }

    function readWorkbookFromArrayBuffer(buffer) {
      const workbook = XLSX.read(buffer, { type: "array" });
      const firstSheetName = workbook.SheetNames[0];
      const worksheet = workbook.Sheets[firstSheetName];
      return XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
    }

    function handleFile(file) {
      if (!file) return;
      if (typeof XLSX === "undefined") {
        statusText.className = "status error";
        statusText.textContent = "엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인하세요.";
        return;
      }

      statusText.className = "status";
      statusText.textContent = `파일 읽는 중: ${file.name}`;

      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          const rows = readWorkbookFromArrayBuffer(event.target.result);
          performanceData = parseExcelRows(rows);
          statusText.className = "status";
          statusText.textContent = `업로드 완료: ${file.name} (자동 집계 성공)`;
          renderAll();
        } catch (error) {
          statusText.className = "status error";
          statusText.textContent = `오류: ${error.message}`;
        }
      };
      reader.onerror = () => {
        statusText.className = "status error";
        statusText.textContent = "파일을 읽는 중 오류가 발생했습니다.";
      };
      reader.readAsArrayBuffer(file);
    }

    function loadSampleData() {
      const sample = createEmptyPerformance();
      for (const employee of EMPLOYEES) {
        for (const category of CATEGORIES) {
          const seed = employee.charCodeAt(0) + category.charCodeAt(0);
          const value = ((seed % 6) + 1) * ((seed % 3) + 1);
          sample[employee][category] = value;
        }
      }
      performanceData = sample;
      statusText.className = "status";
      statusText.textContent = "샘플 데이터를 적용했습니다.";
      renderAll();
    }

    function downloadTemplate() {
      if (typeof XLSX === "undefined") {
        statusText.className = "status error";
        statusText.textContent = "엑셀 라이브러리를 불러오지 못해 양식 다운로드가 불가능합니다.";
        return;
      }

      const rows = [["직원", ...CATEGORIES]];
      for (const employee of EMPLOYEES) {
        rows.push([employee, ...CATEGORIES.map(() => 0)]);
      }
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "프로모션집계");
      XLSX.writeFile(wb, "쌍문역지점_프로모션_양식.xlsx");
    }

    excelInput.addEventListener("change", (event) => {
      const file = event.target.files?.[0];
      handleFile(file);
    });
    sampleBtn.addEventListener("click", loadSampleData);
    downloadTemplateBtn.addEventListener("click", downloadTemplate);

    buildRatesUI();
    buildEmployeeTags();
    renderAll();
  </script>
</body>
</html>
